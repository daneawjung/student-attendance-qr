<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7f1d1d"><title>จัดการภาคเรียน | ระบบเช็กชื่อ</title><link rel="stylesheet" href="style.css?v=52"><style>.term-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.term-card{border:1px solid #e2e8f0;border-radius:18px;padding:18px;background:#fff}.term-card.current{border:2px solid #b91c1c;background:#fffafa}.term-card h2{margin:0 0 8px}.term-meta{color:#64748b;font-size:14px;margin:4px 0}.term-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.term-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.term-form .full{grid-column:1/-1}.term-form label{display:block;font-weight:700;margin-bottom:5px}.term-form input,.term-form select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:10px}.notice{padding:12px 14px;border-radius:12px;background:#f8fafc;margin:12px 0;font-size:14px}@media(max-width:700px){.term-grid,.term-form{grid-template-columns:1fr}.term-form .full{grid-column:auto}}</style></head><body><main class="container"><section class="card wide-card"><div class="topbar"><div><div class="badge">🏫 ระบบเช็กชื่อ</div><h1>⚙️ จัดการภาคเรียน</h1><p class="subtitle">กำหนดปีการศึกษา ภาคเรียน และเลือกภาคเรียนที่กำลังใช้งาน</p></div><div class="top-links"><a class="back-link" href="dashboard.html?v=52">📊 Dashboard</a></div></div><div id="message" class="notice hidden"></div><section class="card" style="margin-bottom:20px"><h2>➕ เปิดภาคเรียนใหม่</h2><p class="term-meta">ระบบสามารถคัดลอก “ตารางเรียนประจำที่กำลังใช้งาน” ไปยังภาคเรียนใหม่ได้ โดยข้อมูลการเช็กชื่อและนักเรียนจะไม่ถูกลบ</p><form id="newTermForm" class="term-form"><div><label>ปีการศึกษา</label><input id="academicYear" type="number" min="2500" max="3000" required></div><div><label>ภาคเรียน</label><select id="semester"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div><div><label>วันเริ่มภาคเรียน</label><input id="startDate" type="date"></div><div><label>วันสิ้นสุดภาคเรียน</label><input id="endDate" type="date"></div><div class="full"><label><input id="copySchedule" type="checkbox" checked> คัดลอกตารางเรียนประจำจากภาคเรียนปัจจุบัน</label></div><div class="full"><button id="createButton" type="submit" class="primary-button">🆕 สร้างภาคเรียนใหม่</button></div></form></section><h2>📚 ภาคเรียนทั้งหมด</h2><div id="termList" class="term-grid"><div class="empty-state">กำลังโหลด...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=52"></script><script src="academic-terms.js?v=52"></script></body></html>
