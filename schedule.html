<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ตารางเรียน | ระบบเช็กชื่อ</title><link rel="stylesheet" href="style.css?v=52"></head><body><main class="container"><section class="card wide-card"><div class="topbar"><div><div class="badge">📅 ตารางเรียนประจำ</div><h1>📅 ตารางเรียนประจำ</h1><p class="subtitle">สร้างตารางครั้งเดียว แล้วใช้ซ้ำทุกสัปดาห์</p></div><div class="top-links"><a class="back-link" href="index.html?v=52">🏠 หน้าแรก</a><a class="back-link" href="dashboard.html?v=52">📊 Dashboard</a><a class="back-link" href="subjects.html?v=52">📚 รายวิชา</a><a class="back-link" href="weekly.html?v=52">📖 ตารางสัปดาห์</a></div></div><form id="scheduleForm" class="student-form"><input id="editId" type="hidden"><div><label>วัน *</label><select id="dayOfWeek" required style="width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px"><option value="1">จันทร์</option><option value="2">อังคาร</option><option value="3">พุธ</option><option value="4">พฤหัสบดี</option><option value="5">ศุกร์</option><option value="6">เสาร์</option><option value="0">อาทิตย์</option></select></div><div><label>เวลาเริ่ม *</label><select id="startTime" required style="width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px"></select></div><div><label>เวลาสิ้นสุด *</label><select id="endTime" required style="width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px"></select></div><div><label>วิชา *</label><select id="subjectId" required style="width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px"><option value="">กำลังโหลดวิชา...</option></select></div><div><label>ห้องเรียน/กลุ่ม *</label><input id="className" required placeholder="ชอ.2/1"></div><div><label>ห้อง</label><input id="room" placeholder="320"></div><div><label>ครูผู้สอน</label><input id="teacherName" placeholder="ชื่อครู"></div><div class="form-actions"><button id="saveButton" type="submit">💾 บันทึกตาราง</button><button id="cancelEdit" type="button" class="small-button" style="display:none;margin-left:8px">ยกเลิกแก้ไข</button></div></form><div id="message" class="result hidden"></div><div class="toolbar"><input id="search" type="search" placeholder="🔎 ค้นหาวิชา ห้อง หรือวัน..."><div class="count" id="count">0 รายการ</div></div><div class="table-wrap"><table><thead><tr><th>วัน</th><th>เวลา</th><th>วิชา</th><th>กลุ่ม</th><th>ห้อง</th><th>ครู</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="table"></tbody></table></div><div id="empty" class="empty-state hidden">ยังไม่มีตารางเรียน</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=52"></script><script src="schedule.js?v=52"></script></body></html>
