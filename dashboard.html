<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard | ระบบเช็กชื่อ</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><section class="card wide-card">
<div class="topbar"><div><div class="badge">Phase 4.6 • Teacher Dashboard</div><h1>📊 Dashboard การเข้าเรียน</h1><p class="subtitle">ดูสถานะนักเรียนของคาบเรียนแบบเรียลไทม์เมื่อกดรีเฟรช</p></div><div class="top-links"><a class="back-link" href="scanner.html">📷 สแกน QR</a><a class="back-link" href="sessions.html">📚 คาบเรียน</a></div></div>
<label>เลือกคาบเรียน</label><select id="sessionSelect" style="width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px"><option value="">กำลังโหลด...</option></select>
<div id="sessionInfo" class="student-info hidden"></div>
<div class="student-grid" style="margin:22px 0"><div class="student-card"><div class="student-number">👨‍🎓</div><h3 id="total">0</h3><p>นักเรียนทั้งหมด</p></div><div class="student-card"><div class="student-number">🟢</div><h3 id="present">0</h3><p>มาเรียน</p></div><div class="student-card"><div class="student-number">🟡</div><h3 id="late">0</h3><p>สาย</p></div><div class="student-card"><div class="student-number">⚪</div><h3 id="unchecked">0</h3><p>ยังไม่เช็กชื่อ</p></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="🔎 ค้นหาชื่อหรือรหัสนักเรียน..."><div class="count" id="updated">-</div></div><div class="table-wrap"><table><thead><tr><th>#</th><th>รหัส</th><th>นักเรียน</th><th>ห้อง</th><th>สถานะ</th><th>เวลา</th></tr></thead><tbody id="studentTable"></tbody></table></div><div id="empty" class="empty-state">เลือกคาบเรียนเพื่อดูรายชื่อ</div>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="dashboard.js"></script></body></html>
