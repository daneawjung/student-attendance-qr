<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ควบคุมการเช็กชื่อ | ระบบเช็กชื่อ</title><link rel="stylesheet" href="style.css?v=15"><style>.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.stat{padding:18px;border:1px solid #dbe3f0;border-radius:16px;background:#f8fafc;text-align:center}.stat strong{display:block;font-size:30px}.stat span{color:#64748b}.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress div{height:100%;width:0;background:#16a34a;transition:width .3s}.control-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.student-list{display:grid;gap:10px}.student-row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:14px;border:1px solid #e2e8f0;border-radius:14px;background:#fff}.student-number{font-weight:700;text-align:center}.student-name small,.student-state small{display:block;color:#64748b;margin-top:3px}.student-state{font-weight:700;text-align:right;min-width:220px}.student-state.waiting{color:#64748b}.student-state.present{color:#15803d}.status-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}.status-actions button{width:auto!important;margin:0!important;padding:7px 10px!important;font-size:13px!important;border-radius:10px!important;box-shadow:none!important}.status-actions button:nth-child(1){background:#dcfce7;color:#166534}.status-actions button:nth-child(2){background:#fef3c7;color:#92400e}.status-actions button:nth-child(3){background:#dbeafe;color:#1e40af}.status-actions button:nth-child(4){background:#fee2e2;color:#991b1b}.status-actions button:hover{transform:translateY(-1px);opacity:.9}.student-state.waiting .status-actions{justify-content:flex-start}@media(max-width:650px){.stats{grid-template-columns:1fr}.control-row{align-items:stretch;flex-direction:column}.student-row{grid-template-columns:32px 1fr}.student-state{text-align:left;grid-column:2;min-width:0}.status-actions{justify-content:flex-start}}</style></head><body><main class="container"><section class="card wide-card"><div class="topbar"><div><div class="badge">Phase 4.11 • Teacher Control</div><h1>📋 ควบคุมการเช็กชื่อ</h1><p class="subtitle">ดูและแก้สถานะนักเรียนได้จากหน้านี้</p></div><div class="top-links"><a class="back-link" id="qrLink" href="#">📱 QR เช็กชื่อ</a> <a class="back-link" href="today.html">← คาบวันนี้</a></div></div><div id="message" class="result hidden"></div><div id="sessionInfo" class="session-info"></div><div class="stats"><div class="stat"><strong id="total">0</strong><span>นักเรียนทั้งหมด</span></div><div class="stat"><strong id="present">0</strong><span>มาแล้ว</span></div><div class="stat"><strong id="remaining">0</strong><span>ยังไม่เช็ก</span></div></div><div class="progress"><div id="progressBar"></div></div><div class="control-row"><span id="lastUpdated">กำลังโหลด...</span><button id="closeBtn" class="start-button">🔒 ปิดการเช็กชื่อ</button></div><div id="studentList" class="student-list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=15"></script><script src="session-control.js?v=15"></script></body></html>
