<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#7f1d1d"><title>ตรวจสอบการเข้าเรียน</title><link rel="stylesheet" href="style.css?v=51"><style>:root{--p:#991b1b;--pd:#7f1d1d}body{background:#f8fafc}.student-checkin-shell{width:100%;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 10px max(18px,env(safe-area-inset-bottom))}.student-checkin-card{width:min(100%,560px);margin:0 auto;padding:20px 16px 24px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 14px 40px rgba(15,23,42,.08)}.student-checkin-header{margin-bottom:18px}.student-checkin-header .badge{margin:0;font-size:12px;padding:6px 11px}.student-checkin-header h1{margin:10px 0 5px;font-size:27px;line-height:1.2}.student-checkin-subtitle{margin:0;color:#64748b;font-size:14px;line-height:1.55}.session-info{margin:0 0 18px;padding:14px;border:1px solid #fee2e2;border-radius:14px;background:#fffafa;color:#334155;font-size:15px;line-height:1.7}.session-info strong{display:block;margin-bottom:2px;color:var(--pd);font-size:18px}.student-checkin-form{margin:0;text-align:left}.student-checkin-form label{display:block;margin:0 0 8px;font-size:15px;font-weight:600;color:#334155}.student-code-input,.registration-input{width:100%;min-height:54px;padding:13px 15px;border:1px solid #cbd5e1;border-radius:14px;font-size:17px;background:#fff;box-sizing:border-box}.student-code-input{text-align:center;letter-spacing:.04em}.student-code-input:focus,.registration-input:focus{outline:3px solid #fee2e2;border-color:#b91c1c}.student-checkin-button,.register-button{width:100%;min-height:54px;margin-top:14px;padding:13px 18px;border:0;border-radius:14px;background:var(--p);color:#fff;font-size:17px;font-weight:700;cursor:pointer}.register-card{margin-top:16px;padding:18px;border:2px dashed #fecaca;border-radius:16px;background:#fffafa}.register-card h2{margin:0 0 5px;color:var(--pd);font-size:20px}.register-card p{margin:0 0 14px;color:#64748b;font-size:14px;line-height:1.6}.register-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.register-grid>div:first-child{grid-column:1/-1}.checkin-message{margin-top:14px;padding:18px;border-radius:14px;line-height:1.65;white-space:pre-line;overflow-wrap:anywhere;font-size:16px;font-weight:500}.confirmation-card{margin-top:14px;padding:18px;border:1px solid #cbd5e1;border-radius:16px;background:#f8fafc;text-align:center}.confirmation-card h2{margin:0 0 12px;font-size:20px;color:#334155}.confirmation-name{margin:0 0 8px;font-size:21px;font-weight:800;color:var(--pd)}.confirmation-detail{margin:4px 0;color:#475569;font-size:15px;line-height:1.6}.confirmation-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.confirmation-actions button{min-height:52px;border:0;border-radius:13px;font-size:16px;font-weight:700;cursor:pointer}.confirm-identity{background:#166534;color:#fff}.cancel-identity{background:#e2e8f0;color:#334155}.hidden{display:none!important}@media(max-width:480px){.confirmation-actions,.register-grid{grid-template-columns:1fr}.register-grid>div:first-child{grid-column:auto}}@media(min-width:481px){.student-checkin-card{padding:28px 30px 32px;border-radius:20px}.student-checkin-header h1{font-size:32px}}</style></head>
<body><main class="student-checkin-shell"><section class="student-checkin-card" aria-labelledby="checkin-title"><header class="student-checkin-header"><div class="badge">ระบบเช็กชื่อด้วย QR Code</div><h1 id="checkin-title">📋 ตรวจสอบการเข้าเรียน</h1><p class="student-checkin-subtitle">วิทยาลัยเทคนิคพนมสารคาม</p></header><div id="attendance-content"><div id="sessionInfo" class="session-info" aria-live="polite">กำลังโหลดข้อมูลคาบเรียน...</div><form id="attendanceForm" class="student-checkin-form" novalidate><label for="studentCode">รหัสนักเรียน</label><input id="studentCode" class="student-code-input" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="กรอกรหัสนักเรียน" required><button id="confirmButton" class="student-checkin-button" type="submit">🔎 ตรวจสอบข้อมูล</button></form><div id="registerCard" class="register-card hidden"><h2>➕ ไม่พบข้อมูลนักเรียน</h2><p id="registerHint">สามารถลงทะเบียนเข้ารายวิชานี้ได้</p><form id="registerForm"><div class="register-grid"><div><label for="registerPrefix">คำนำหน้า</label><input id="registerPrefix" class="registration-input" placeholder="นาย / นางสาว / นาง"></div><div><label for="registerFirstName">ชื่อ *</label><input id="registerFirstName" class="registration-input" required></div><div><label for="registerLastName">นามสกุล *</label><input id="registerLastName" class="registration-input" required></div></div><button id="registerButton" class="register-button" type="submit">📝 ลงทะเบียนและเช็กชื่อ</button></form></div><div id="confirmation" class="confirmation-card hidden" role="dialog" aria-labelledby="confirmationTitle" aria-live="polite"></div><div id="message" class="checkin-message hidden" role="status" aria-live="polite"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=56"></script><script src="attendance.js?v=56"></script></body></html>
