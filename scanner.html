<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>สแกน QR | ระบบเช็กชื่อ</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><section class="card wide-card">
